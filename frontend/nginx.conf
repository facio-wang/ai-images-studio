# ===== bitmystic.online 共用域名站点配置 (Phase 5 CICD) =====
# 前端 Admin 静态托管 + 后端 admin-api 反向代理
# URL 区分项目：/admin/ -> 前端，/admin-api/ -> 后端 /admin/

server {
    listen       80;
    server_name  bitmystic.online;

    # 前端 Admin 单页应用（history 模式，try_files 回退 index.html）
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 后端 Admin API 反向代理
    # /admin-api/xxx -> 后端服务 /admin/xxx
    location /admin-api/ {
        proxy_pass http://admin-api:8081/admin/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级（如需 ws 推送）
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    # 根路径默认页
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
